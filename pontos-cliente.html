<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="admin.css" />
    <script src="admin.js" defer></script>
    <script src="dados.js" defer></script>
    <script src="cliente.js" defer></script>
    <script src="pontos-cliente.js" defer></script>

    <title>Pontos · Canoas Bus</title>
  </head>
  <body data-pagina="pontos" data-perfil="cliente">
    <!-- Cabeçalho -->
    <header class="topo">
      <a class="topo-marca" href="mapa-cliente.html">
        <i class="fa-solid fa-bus-simple topo-logo" aria-hidden="true"></i>
        <span>Canoas Bus</span>
      </a>

      <nav class="topo-nav" aria-label="Principal">
        <a href="mapa-cliente.html" data-pagina="mapa">Mapa</a>
        <a href="linhas-cliente.html" data-pagina="linhas">Linhas</a>
        <a href="pontos-cliente.html" data-pagina="pontos">Pontos</a>
        <a href="favoritos.html" data-pagina="favoritos">Favoritos</a>
      </nav>

      <div class="topo-usuario">
        <span id="topo-nome-usuario">Cliente</span>
        <a href="perfil.html">Meu perfil</a>
        <button type="button" class="topo-sair" data-sair>
          Sair <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        </button>
      </div>

      <button
        type="button"
        class="topo-menu-botao"
        id="abrir-menu"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="menu-lateral"
      >
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
    </header>

    <!-- Menu lateral (celular) -->
    <div class="menu-fundo" id="menu-fundo"></div>
    <aside
      class="menu-lateral"
      id="menu-lateral"
      aria-label="Menu de navegação"
    >
      <div class="menu-topo">
        <div class="topo-marca">
          <i class="fa-solid fa-bus-simple topo-logo" aria-hidden="true"></i>
          <span>Canoas Bus</span>
        </div>
        <button
          type="button"
          class="menu-fechar"
          id="fechar-menu"
          aria-label="Fechar menu"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>

      <p class="menu-rotulo">MENU</p>
      <nav>
        <a href="mapa-cliente.html" data-pagina="mapa"
          ><i class="fa-solid fa-location-dot" aria-hidden="true"></i> Mapa</a
        >
        <a href="linhas-cliente.html" data-pagina="linhas"
          ><i class="fa-solid fa-list" aria-hidden="true"></i> Linhas</a
        >
        <a href="pontos-cliente.html" data-pagina="pontos"
          ><i class="fa-solid fa-map-pin" aria-hidden="true"></i> Pontos</a
        >
        <a href="favoritos.html" data-pagina="favoritos"
          ><i class="fa-solid fa-star" aria-hidden="true"></i> Favoritos</a
        >
        <a href="perfil.html"
          ><i class="fa-solid fa-user" aria-hidden="true"></i> Meu perfil</a
        >
      </nav>

      <div class="menu-divisor"></div>
      <button type="button" class="menu-sair" data-sair>
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Sair
      </button>

      <p class="menu-rodape">Canoas Bus · Mobilidade mais simples</p>
    </aside>

    <!-- Conteúdo -->
    <main class="conteudo">
      <div class="conteudo-cabecalho">
        <div>
          <h1 class="conteudo-titulo">Pontos de ônibus</h1>
          <p class="conteudo-descricao">
            Encontre os locais de embarque e favorite os que você mais usa.
          </p>
        </div>
      </div>

      <div class="barra-busca">
        <div class="campo-busca">
          <input
            type="search"
            id="busca"
            placeholder="Buscar nome ou endereço"
            aria-label="Buscar ponto por nome ou endereço"
          />
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        </div>
        <p class="contador" id="contador" aria-live="polite"></p>
      </div>

      <div class="grade-cartoes" id="grade-pontos"></div>
      <p class="vazio" id="mensagem-vazia" hidden>Nenhum ponto encontrado.</p>
      <button type="button" class="botao-mais" id="mostrar-mais" hidden>
        Mostrar mais
      </button>
    </main>

    <footer class="rodape">
      <p>Dados de exemplo · Canoas, RS</p>
    </footer>
  </body>
</html>
