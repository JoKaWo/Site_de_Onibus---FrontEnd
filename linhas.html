<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
  <title>Pontos· Canoas Bus</title>
</head>

<body>
  <!-- Cabeçalho -->
  <header class="cabecalho">
    <div class="cabecalho-logo">
      <img src="./assets/logo.png" alt="Ícone de ônibus" />
    </div>
    <h1 class="cabecalho-titulo">Canoas Bus</h1>

    <nav class="cabecalho-opcoes">
      <a href="#">Mapa</a>
      <a href="#">Linhas</a>
      <a href="#" class="ativo">Pontos</a>
    </nav>

    <div class="cabecalho-usuario-sair">
      <div class="cabecalho-usuario">Administrador</div>
      <div class="cabecalho-perfil">Meu perfil</div>
      <div class="cabecalho-sair">
        <a href="./index.html">Sair</a>
        <img src="./assets/sair.png" alt="Ícone sair" />
      </div>
    </div>
    <button class="btn-menu" aria-label="Abrir menu">
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>


  <main class="main-linhas">
    <aside class="dados-cabecalho-container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li><a href="#">Administração</a></li>
          <li><a href="#">Pontos</a></li>
        </ol>
      </nav>

    <div class="conteudo-principal">
      <div class="conteudo-principal-esq">
        <h1 class="dados-titulo">Linhas de ônibus</h1>
        <span class="dados-subtitulo">Organize as linhas e seus itinerários.</span>
      </div>
      <button class="botao-adicionar" id="botao-adicionar-linha">Adicionar linha</button>
    </div>
  </main>
</body>

</html>
